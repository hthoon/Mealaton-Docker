events {}

http {
    upstream spring_server {
        server app:11111;
    }

    server {
        listen 80;
        server_name mealaton.com www.mealaton.com;

        # 인증서 자동 갱신 대비
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # HTTPS(443) 서버 설정
    server {
        listen 443 ssl;
        server_name mealaton.com www.mealaton.com;

        # 인증서와 비밀키 경로
        ssl_certificate /etc/letsencrypt/live/mealaton.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mealaton.com/privkey.pem;

        # 보안 강화 설정
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;

        # Spring 서버로 트래픽 전달
        location / {
            proxy_pass http://spring_server;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            # 현재 HTTPS로 통신 중임을 Spring에 알려주는 헤더
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}